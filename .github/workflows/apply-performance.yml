name: Apply and validate ESP32-S3 performance changes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-performance.yml']
permissions:
  contents: read
concurrency:
  group: apply-performance
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Verify and apply the locally tested patch
        shell: bash
        run: |
          set -euo pipefail
          upstream=d3de03f28364251651cc832f291197d0fab46d92
          git merge-base --is-ancestor "$upstream" HEAD
          git diff --exit-code "$upstream" HEAD -- README.md esp32 docs/PERFORMANCE.md tests
          cat .bootstrap/performance.patch.xz.b64.{1,2,3} | base64 --decode | xz --decompress > "$RUNNER_TEMP/performance.patch"
          echo '7cbe94e4ad6620211be6162bad636879315dfcc0248533045a2f0d46bbb3e6ed  '"$RUNNER_TEMP/performance.patch" | sha256sum --check
          git apply --check --unidiff-zero "$RUNNER_TEMP/performance.patch"
          git apply --unidiff-zero "$RUNNER_TEMP/performance.patch"
          git diff --check
      - name: Compile and run native regression and sanitizer tests
        run: |
          make -C esp32/host -j2
          bash tests/run_host.sh
          python3 -m compileall -q esp32/tools esp32/host
          bash -n esp32/tools/emulate.sh esp32/tools/run_qemu.sh tests/run_host.sh
      - name: Compare all 70 cases against the original engine
        run: |
          python3 -m pip install numpy
          git worktree add --detach "$RUNNER_TEMP/upstream" d3de03f28364251651cc832f291197d0fab46d92
          make -C "$RUNNER_TEMP/upstream/esp32/host" -j2 CFLAGS='-O2 -D_DEFAULT_SOURCE -std=c11 -ffp-contract=off -I../components/tinyasr/include -I../components/tinyasr -Wall -Wno-unused-function'
          python3 -u tests/compare_upstream.py "$RUNNER_TEMP/upstream/esp32/host/libtinyasr.dylib" --full
      - name: Commit tested source and remove one-time transport files
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .bootstrap/performance.patch.xz.b64.{1,2,3} .github/workflows/apply-performance.yml
          git add README.md docs/PERFORMANCE.md esp32 tests
          git commit -m 'Optimize ESP32-S3 STT workspace, audio pipeline and profiling' -m 'Reuse phase-packed inference workspace; preserve default arithmetic; fuse pointwise jobs; bound and cache beam decoding; separate continuous segmentation from inference; use 64-bit wall timing. Keep float statistics and tail trimming opt-in. Add native, sanitizer, failure-injection and 70-case upstream parity tests.'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  firmware:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [file, mic]
    container: espressif/idf:v5.5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.apply.outputs.source_sha }}
          persist-credentials: false
      - name: Compile ESP32-S3 firmware with ESP-IDF 5.5
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -eo pipefail
          . "$IDF_PATH/export.sh"
          cd esp32/firmware
          defaults='sdkconfig.defaults;sdkconfig.nemo16bench'
          if [[ "$MODE" == mic ]]; then defaults='sdkconfig.defaults;sdkconfig.nemo16lm;sdkconfig.mic;sdkconfig.oled'; fi
          idf.py -B "build_$MODE" -D "SDKCONFIG=sdkconfig_ci_$MODE" -D "SDKCONFIG_DEFAULTS=$defaults" build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firmware-${{ matrix.mode }}
          path: |
            esp32/firmware/build_${{ matrix.mode }}/*.bin
            esp32/firmware/build_${{ matrix.mode }}/*.elf
            esp32/firmware/build_${{ matrix.mode }}/bootloader/bootloader.bin
            esp32/firmware/build_${{ matrix.mode }}/partition_table/partition-table.bin
          retention-days: 7
